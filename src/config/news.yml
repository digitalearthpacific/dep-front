- title: Fiji Concludes the Management and Conservation of Blue Carbon Ecosystems (MACBLUE) Project with closing event
  description: The MACBLUE project partners, the Ministry of Environment and Climate Change, Secretariat of the Pacific Regional Environment Programme (SPREP), the Pacific Community (SPC), and the Deutsche Gesellschaft für Internationale Zusammenarbeit (GIZ), gathered on the 23rd of October in Suva to mark the successful closing of the project in Fiji. 
