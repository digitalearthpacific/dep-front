- title: The launch of Digital Earth Pacific during the 53rd CRGA and the 13th Conference
  description: The Pacific Community (SPC) launched Digital Earth Pacific as part of its 53rd meeting of the Committee of Representatives of Governments and Administrations and 13th Conference in Noumea, New Caledonia. The launch was officiated by Vice-President of the Federated States of Micronesia, Honourable Aren B Palik, who expressed how critical tools like this will be for the FSM. Digital Earth Pacific will now continue to evolve, providing more tools for countries to make informed decisions, such as tracking blue carbon or tracking illegal fishing in the Pacific in real time.
  url: https://www.spc.int/updates/news/media-release/2023/10/the-launch-of-digital-earth-pacific-during-the-53rd-meeting-of
  source: Pacific Community (SPC)
  published: October, 2023
  banner: https://www.spc.int/sites/default/files/images/GEM/DSCF0868.JPG

- title: Digital Earth Pacific - how open data is combatting rising tides?
  description: Globally, the effects of climate change are already being observed through increases in drought, forest fires, sea level rise, flooding, and hunger. Given the vulnerability of Pacific Island countries and territories (PICTs) in this respect, the Pacific region specifically faces unique challenges in managing natural resources and biodiversity, securing economies and livelihoods, and ensuring sustainable food systems.  Digital public infrastructure (DPI) that supports the flow and exchange of data and services is critical in overcoming these challenges.
  url: https://dial.global/digital-earth-pacific-how-open-data-is-combatting-rising-tides/
  source: Aditya Agrawal, Digital Impact Alliance
  published: September, 2023
  banner: https://dial.global/wp-content/uploads/2023/09/AdobeStock_556113380-1060x706.jpeg

