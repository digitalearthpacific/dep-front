- title: The Pacific Community and the Pacific GIS and Remote Sensing Council sign an MoU to strengthen Pacific geospatial work 
  description: The Pacific Community (SPC) and the Pacific GIS and Remote Sensing Council (PGRSC) have signed a Memorandum of Understanding (MoU) to collaborate on outreach, training, and promotion of regional networking in support of strengthening geospatial and earth observation work for Pacific communities, thereby better informing decision-makers and the public about the importance and great potential of these technologies. 
  url: https://www.spc.int/updates/news/joint-release/2025/09/the-pacific-community-and-the-pacific-gis-and-remote-sensing
