- title: Fighting invasive species to protect Vanuatu’s forests and people
  description: Invasive species are the leading driver of biodiversity loss in the Pacific, undermining food security, freshwater systems, and climate resilience. For Vanuatu, where forests cover more than one-third of the land and provide vital resources for communities, tackling invasive plants has become a national priority. 
  url: https://www.spc.int/updates/blog/dynamic-story/2025/09/fighting-invasive-species-to-protect-vanuatus-forests-and-people
  source: Pacific Community (SPC)
  published: 25 September, 2025
