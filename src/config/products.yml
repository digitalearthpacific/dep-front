- title: Pacific Mangroves Change Detection
  description: Pacific Mangroves is a regional product that shows mangrove coverage extent and canopy density as percentage. The product provides greater temporal coverage (2017-2024) and allows for ongoing annual monitoring across Pacific Island Countries and Territories (PICTs). 
  methodology: Mangrove extents and classifications were based on Automatic Mangrove Mapping Index (AMMI) approaches as applied in Suyarso and Avianto (2022). Canopy density categories of 5-20 are scaled for visualisation of percentage thresholds representing increasing canopy density. These processes are applied to the Sentinel-2 Geometric Median and Median Absolute Deviations (GeoMAD) alpha annual product. Sea and elevation masks are applied to reduce false positives. Elevation mask of 40m was applied to account for the relative tidal influence of brackish wetlands in areas like the Gulf Region of PNG.
  uses: The DEP Mangroves product supports PICTs to map the extent of mangroves as a requirement to baseline and ongoing Measurement, Reporting and Verification (MRV) for carbon removal projects, REDD+ reporting, national GHG inventory reporting requirements, Blue Carbon accounting and National Forest Inventories. The applications also extend beyond blue carbon ecosystems to biodiversity and the mapping of natural shoreline protection.
  citation: Singh. S., Leith, A. (2025). Mangrove extent - Digital Earth Pacific (DEP). Secretariat of the Pacific Community (SPC).
  thumbnailUrl: ./images/apps/ammi_mangroves.png
  links:
    - title: Explore Mangroves Change Detection 
      url: https://maps.digitalearthpacific.org/#share=s-lqqXCbyjLeMtNJZJ06MP


- title: Geometric Median and Median Absolute Deviations (GeoMAD) (alpha)
  description: The GeoMAD Sentinel-2 product is a cloud-free composite of satellite data that consolidates multi-temporal imagery into an annual, representative dataset. By integrating geomedian statistics with higher-order measures of variation (MADs), the product enables reliable, consistent monitoring of land and marine environments across the Pacific region, even in regions frequently obscured by clouds. GeoMAD also enables “on-the-fly” visualisation of critical indices around vegetation, water and moisture monitoring, which enables decision making around agriculture, vegetation and climate domain areas.
  methodology: For this product satellite input data is filtered using the Scene Classification Layer (SCL) metadata which removes invalid pixels to improve data quality, specifically excluding pixels identified as saturated or defective (SCL=1), cloud shadows (SCL=3), medium probability clouds (SCL=8), high probability clouds (SCL=9), and thin cirrus clouds (SCL=10). A multi-spectral geomedian is then calculated for each pixel, representing the central value of valid observations collected over the course of a year. In addition, Median Absolute Deviations (MADs) are computed to quantify variation in the data relative to the geomedian, allowing for higher-order statistical analysis. The cleaned and processed imagery is then aggregated using the GeoMAD algorithm, producing an annual cloud-free surface-reflection composite dataset. 
  uses: This product can be used for a wide range of practical applications. In disaster response and recovery, it provides a reliable cloud-free baseline for assessing damage and guiding recovery after events such as cyclones and floods. For land cover and vegetation monitoring, the product enables the tracking of changes in land use, forest cover, and agricultural patterns. In the context of climate resilience, GeoMAD helps monitor long-term environmental shifts, offering critical insights for climate adaptation and mitigation strategies. 
  citation: Leith, A. (2024). Geometric Median and Median Absolute Deviations (GeoMAD) - Digital Earth Pacific (DEP). Secretariat of the Pacific Community (SPC).
  thumbnailUrl: ./images/apps/geomad.png
  links:
    - title: Explore a GeoMAD Use Case
      url: https://maps.digitalearthpacific.org/#share=s-wZ7yabgMSaeNqFWNRulH


- title: Satellite Derived Bathymetry (SDB) (alpha)
  description: The optical Satellite Derived Bathymetry (SDB) product provides critical depth data for shallow marine environments, reaching depths of up to 30 meters. This dataset supports a range of ocean and coastal management applications by delivering high-resolution bathymetric information in regions that are often difficult or expensive to survey using traditional methods.
  methodology: The SDB product utilises multispectral imagery from the Sentinel-2 satellite, and masks both land and deep water. A machine learning model is then trained on decades of legacy multibeam data collected by SPC, and used to predict depth. Predictions are made based on scene-based observations, and the mean of all predictions over a year is used as the final result. Depth estimations are validated using in situ measurements, where available, to ensure accuracy and reliability.
  uses: This product can be used for navigation, marine spatial planning, oceanographic studies and environmental monitoring. Specifically, for mapping fishing grounds, monitoring coastal erosion, modelling coastal inundation and sea level rise, mapping and monitoring benthic habitats to identify and protect sensitive marine habitats and studying ocean currents, tsunamis, and other marine processes.
  citation: Singh. S., Leith, A. (2025). Satellite Derived Bathymetry (SDB) - Digital Earth Pacific (DEP). Secretariat of the Pacific Community (SPC).
  thumbnailUrl: ./images/apps/sdb.png
  links:
    - title: Explore a SDB Use Case
      url: https://maps.digitalearthpacific.org/#share=s-6QZXXBbO2tYhhRYNmoxK

- title: Pacific Intertidal Model (alpha)
  description: The Intertidal Product maps the dynamic elevation, exposure, and tidal characteristics of the intertidal zone, the transitional area between the highest high tide and the lowest low tide. This zone encompasses sandy beaches, tidal flats, rocky shores, and reef systems. The product provides a consistent, regional-scale understanding of how these environments are exposed and submerged over time, offering crucial insights into coastal morphology and hydrodynamic processes.
  methodology: Combined satellite imagery from Sentinel-2 and Landsat 8 for the year 2024 is analysed to identify the exposed intertidal zones, which are the areas where coastal water is present or absent across tidal cycles. Using statistical and remote sensing analysis, pixels are classified based on frequency of exposure, which is then correlated with tidal models. The result is a high-resolution (30 m/px) representation of the intertidal topography and exposure.
  uses: This product can support a range of scientific, environmental, and planning efforts, including but not limited to, coastal erosion monitoring, land reclamation assessments, sea-level rise impact studies, biodiversity conservation and benthic habitat mapping.
  citation: Singh. S. (2025). Pacific Intertidal Model - Digital Earth Pacific (DEP). Secretariat of the Pacific Community (SPC).
  thumbnailUrl: ./images/apps/intertidal.png
  links:
    - title: Explore a Pacific Intertidal Model Use Case
      url: https://maps.digitalearthpacific.org/#share=s-ledJcDVFLf75QI4P5eWe 

- title: Fractional Cover (alpha)
  description: Fractional cover describes the landscape in terms of coverage by green vegetation, non-green vegetation, and bare soil. It provides insight into how areas of dry vegetation and/or bare soil, as well as those with green vegetation, are changing over time. This product has a spatial resolution of 30 m and temporal coverage from the 1980s to the present. It is derived from the Landsat Collection 2 Surface Reflectance product.  
  methodology: The fractional cover algorithm works by partitioning each 30-m pixel into percentages of each of the three components using a linear spectral unmixing approach, which also estimates the prediction error. This algorithm is applied to each available landsat scene from 1984 onward across all Pacific Island Countries and Territories. Annual summaries are calculated by estimating the 10th, 50th, and 90th percentiles of each component at the pixel level across all landsat images for each year.
  uses: Fractional cover enables users to understand large-scale patterns and trends, informing evidence-based decision-making and policy on topics such as forest and agricultural monitoring, wind and water erosion risk, soil carbon dynamics, land surface process monitoring, land management practices, and other uses. The algorithm was developed by the Joint Remote Sensing Research Program, School of Geography, Planning and Environmental Management, University of Queensland, and has been previously applied in the Digital Earth Australia and Digital Earth Africa projects. For more information, see https://doi.org/10.3390/rs6097952.
  citation: Anderson, J. (2025). Fractional Cover - Digital Earth Pacific (DEP). Secretariat of the Pacific Community (SPC).
  thumbnailUrl: ./images/apps/factional_cover.png
  links:
    - title: Explore Fractional Cover
      url: https://maps.digitalearthpacific.org/#share=s-jremXd2LmmjUpIxlRh4F

- title: Seagrass Extents (alpha)
  description: Seagrass extents provide estimates of seagrass area over time. These datasets complement global models of marine benthic habitats, including the Allen Coral Atlas, by providing regional-scale coverage for Pacific Island countries and territories. While this dataset has a relatively lower spatial resolution than the Allen Coral Atlas, it offers greater temporal coverage, allowing for ongoing monitoring. The layers include seagrass extents, conservative estimates at a 60% probability threshold against nine other classes, seagrass probability visualised as a continuum and broader coastal marine habitats. Note that this product is still undergoing validation, which will be completed in three stages. These include a) an 80-20 split validation and confusion matrix testing, b) validation from separate geotagged observation points collected through an independent third-party scientific organisation and c) through consultation with counterparts from Pacific Island countries and territories government and research institutes.
  methodology: Field surveys were conducted through the MACBLUE project funded by the Federal Ministry of Environment, Nature Conservation, Nuclear Safety and Consumer Protection (BMUV) and implemented by GIZ alongside SPC and SPREP. The data points sampled Sentinel 2 data from the Geometric Median and Median Absolute Deviations (GeoMAD) product, including spectral, texture and variability values used to train machine learning classifiers. After applying several mask functions, the classifier predictions are applied to the GeoMAD datasets to generate annual maps of seagrass extent and coastal marine habitats. 
  uses: Use case applications include carbon stock assessments, biodiversity assessments, marine protected area monitoring, environmental impact assessments, physical oceanography prediction and modelling, ocean accounts, and other applications within maritime and fisheries sectors. 
  citation: Metherall, N., et al. (2025). Seagrass Extents - Digital Earth Pacific (DEP). Secretariat of the Pacific Community (SPC).
  thumbnailUrl: ./images/apps/seagrass.png
  links:
    - title: Explore a Seagrass Extents Use Case
