- title: Pacific Coastlines Change
  description: Pacific Coastlines beta version product includes coastline change detection for the years 1999-2023 for the Pacific Island Country and Territories (PICTs). This product provides ongoing monitoring of coastline change detection. This provides insights into processes including erosion (where landmass area decreases) and accretion or deposition (where landmass area increases). 
  methodology: This product is based on a workflow used to map annual coastline locations in Australia and Africa as part of the Digital Earth Australia and Digital Earth Africa projects. For each year, all available Landsat satellite data were collected for each location, then filtered to remove clouds and other noise. Annual mosaics were created by calculating the median image values among times of near-average (0-m) sea level using a tidal model. Finally, a water discrimination technique was applied which allowed delineation of exact coastlines at the subpixel level. Validation results are being finalised.
  uses: The coastlines product can be useful for monitoring patterns of movement in annual shoreline locations and determining the velocity and direction of any changes. The product does not attempt to determine causal factors for any observed changes. It may be used in combination with local observations and knowledge, as well as other external information, to gain a deeper and more comprehensive understanding of possible causes and effects. This product can be applied to analysis around coastal development planning, the exposure of economic assets and the risk of hazards. The product also sheds light on the correlation between past physical developments, natural disasters and coastal responses to these events.
  citation: Anderson, J. Singh. S. (2023). Coastline change detection - Digital Earth Pacific (DEP). Secretariat of the Pacific Community (SPC).
  thumbnailUrl: ./images/apps/coastlines.png
  links:
    - title: Explore a Coastlines Change Use Case
      url: https://maps.digitalearthpacific.org/#share=s-wBita83VzMJyQ1kPi1nn


- title: Water Observations from Space (WOfS)
  description:  Water Observations from Space (WOfS) beta version product for Water Observations from Space (WOfS) is an annual summary of the temporal and spatial extent of surface water over landscapes. In essence, this highlights where water is typically found or where it is rarely found. The results are visualised to compare points in time spanning over a year, a season or multiple years. The dataset has been produced for the entire Landsat 4-9 archive, spanning from 1984 and extending through to 2024.
  methodology: For each year, all available Landsat data were collected and then filtered to remove cloud cover. A complex decision tree algorithm was applied, producing a water mask for each date. Annual mosaics were created by calculating the percentage of dates within each year when a particular location contained water. 
  uses: The product may be used for a range of applications including monitoring surface water access and, detecting intra-annual and inter-annual changes in water bodies over decades such as droughts, flooding, water harvesting and storage. This can be applied to measure reservoir levels in dams, assess ecological connectivity and examine surface-groundwater relationships.
  citation: Anderson, J. (2023). Water Observations from Space (WOfS) - Digital Earth Pacific (DEP). Secretariat of the Pacific Community (SPC).
  thumbnailUrl: ./images/apps/wofs.png
